<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <title>Orbit logo</title>
  <desc>A C-shaped crescent planet with an orbit, a rabbit-ear mooncake, and a small orbit node.</desc>

  <defs>
