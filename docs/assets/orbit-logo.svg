      <stop stop-color="#0875A5"/>
      <stop offset="0.52" stop-color="#0C9CC6"/>
      <stop offset="1" stop-color="#14789D"/>
    </linearGradient>
    <linearGradient id="orbit-front-gradient" x1="82" y1="377" x2="458" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33C9D6"/>
      <stop offset="0.55" stop-color="#54E4D8"/>
      <stop offset="1" stop-color="#2FC2D8"/>
    </linearGradient>
    <linearGradient id="moon-body-gradient" x1="150" y1="158" x2="299" y2="377" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7A3"/>
      <stop offset="0.54" stop-color="#F8D27D"/>
      <stop offset="1" stop-color="#E8B755"/>
    </linearGradient>
    <linearGradient id="moon-highlight-gradient" x1="139" y1="174" x2="215" y2="372" gradientUnits="userSpaceOnUse">
