    <path d="M74 338C53 292 67 231 116 180C169 124 244 106 318 118C387 129 438 172 457 224C470 259 463 297 440 331" stroke="url(#orbit-back-gradient)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g id="orbit-front" data-layer="orbit-front" inkscape:groupmode="layer" inkscape:label="Orbit front arc">
    <path d="M74 338C78 378 128 408 195 422C285 441 380 401 437 326C450 309 458 290 462 269" stroke="url(#orbit-front-gradient)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g id="moon-planet" data-layer="moon-planet" inkscape:groupmode="layer" inkscape:label="C-shaped moon planet">
    <path id="moon-body" d="M313 141C272 123 218 128 175 156C133 184 112 226 113 268C115 321 148 367 195 386C235 402 278 395 319 373C278 348 253 304 253 258C253 211 276 169 313 141Z" fill="url(#moon-body-gradient)" stroke="#0B3158" stroke-width="11" stroke-linejoin="round"/>
    <path id="moon-highlight" d="M204 145C161 164 133 205 129 251C125 307 153 354 204 379C177 348 164 312 166 270C168 217 185 173 223 148C217 146 210 145 204 145Z" fill="url(#moon-highlight-gradient)"/>
