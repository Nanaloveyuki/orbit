<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="status">ORBIT / NATIVE WEBVIEW</div>
    <h1>HTML rendered by MoonView</h1>
    <p>This page is loaded by the Orbit example executable through the shared runtime contract.</p>
    <button id="action" type="button">Verify page interaction</button>
    <button id="pick-file" type="button">Choose file</button>
    <button id="save-file" type="button">Save text copy</button>
    <button id="pick-directory" type="button">Choose folder</button>
    <button id="print-page" type="button">Print page</button>
    <div id="message" aria-live="polite"></div>
    <div id="selection" aria-live="polite"></div>
    <div id="directory-entries" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
